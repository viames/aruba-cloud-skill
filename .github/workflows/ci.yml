name: CLI fixture tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-pinned official CLI
        run: python3 scripts/install_cli.py
      - name: Verify installed CLI
        run: python3 scripts/inventory.py doctor
      - name: Test real CLI against local fixtures
        run: python3 scripts/test_inventory.py
      - name: Run account-free local demo
        run: python3 scripts/demo.py
      - name: Test offline reports and comparisons
        run: python3 scripts/test_reports.py
      - name: Verify plugin and marketplace packaging
        run: python3 scripts/package_plugin.py
